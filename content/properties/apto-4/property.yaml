  #   pt: Check-in a partir das 14h · Check-out até 11h · Mínimo de 4 noites, o ano todo · Até 3 pessoas ·
  #       Não se fuma em nenhum cômodo · Não aceitamos pets · Crianças são bem-vindas · Sem berço nem cama extra
  #   en: Check-in from 2 pm · Check-out by 11 am · 4-night minimum, all year · Sleeps 3 ·
  #       No smoking anywhere in the apartment · No pets · Children welcome · No crib or extra bed
  #   es: Check-in desde las 14 · Check-out hasta las 11 · Mínimo 4 noches, todo el año · Hasta 3 personas ·
  #       No se puede fumar en ningún ambiente · No se aceptan mascotas · Los chicos son bienvenidos · No hay cuna ni cama extra
  notes:
