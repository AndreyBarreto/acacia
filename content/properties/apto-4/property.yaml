    pt: 'Apartamento com varanda e vista para o mar em Jurerê'
    en: 'Jurerê Apartment with Balcony and Sea View'
    es: 'Departamento con balcón y vista al mar en Jurerê'
  description: # 70 a 155
    pt: 'Apartamento para até 3 pessoas com varanda e vista para o mar, a 50 m da praia em Jurerê. 1 quarto, garagem e Wi-Fi. Mínimo de 4 noites.'
    en: 'Apartment for up to 3 guests with a balcony and sea view, 50 m from the beach in Jurerê. 1 bedroom, free parking, Wi-Fi. 4-night minimum.'
    es: 'Departamento para hasta 3 personas con balcón y vista al mar, a 50 m de la playa en Jurerê. 1 dormitorio, cochera y Wi-Fi. Mínimo 4 noches.'

