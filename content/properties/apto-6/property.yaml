seo: # T12 §6.4; "garaje" trocado por "cochera" (decisão T05)
  title: # ≤ 60
    pt: 'Apartamento térreo a 50 m da praia em Jurerê'
    en: 'Ground-Floor Apartment 50 m from Jurerê Beach'
    es: 'Departamento en planta baja a 50 m de la playa, Jurerê'
  description: # 70 a 155
    pt: 'Apartamento térreo, sem escada, para até 3 pessoas, a 50 m da praia em Jurerê. 1 quarto, garagem e Wi-Fi. Mínimo de 4 noites.'
    en: 'Step-free ground-floor apartment for up to 3 guests, 50 m from the beach in Jurerê. 1 bedroom, free parking, Wi-Fi. 4-night minimum.'
    es: 'Departamento en planta baja, sin escalones, para hasta 3 personas a 50 m de la playa en Jurerê. 1 dormitorio, cochera y Wi-Fi. Mínimo 4 noches.'

capacity:
  maxGuests: 3
bedrooms: 1
bathrooms: 1
floorSizeM2: 33
sleepingAreas:
  - room: bedroom
    beds: [{ type: double, count: 1 }]
  - room: livingRoom
    beds: [{ type: sofaBed, count: 1 }]
floor: ground
views: [mountain, courtyard]

amenities: # somadas às do prédio (wifi, freeParking, privateEntrance, beachGear, fireExtinguisher)
  - airConditioning
  - heating
  - kitchen
  - ovenStove
  - microwave
  - minibar
  - coffeeMaker
  - kitchenware
  - diningTable
  - tv
  - streaming
  - desk
  - bedLinen
  - towels
  - hairDryer
  - wardrobe
  - iron
  - dryingRack
  # Sem wheelchairAccessible: o Booking marca, mas o usuário só confirmou "sem degraus".

rules:
  checkIn: { from: '14:00' }
  checkOut: { until: '11:00' }
  minNights: 4
  smoking: false
  pets: false
  children: true
  crib: false
  selfCheckIn: true
  # Texto das regras estruturadas: igual ao do apto 4 (ver comentário em apto-4.yaml; final na T19).
  notes:
    pt:
      - 'Avise pelo WhatsApp, com antecedência, a que horas pretende chegar.'
      - 'Pagamento e cancelamento: combinamos pelo WhatsApp, antes de confirmar a reserva.' # TODO: tirar se a T19 puser essa frase na UI
    en:
      - "Let us know on WhatsApp, ahead of time, roughly when you'll arrive."
      - 'Payment and cancellation are agreed on WhatsApp before we confirm your stay.'
    es:
      - 'Avisanos por WhatsApp, con tiempo, a qué hora pensás llegar.'
      - 'Pago y cancelación: lo arreglamos por WhatsApp antes de confirmar la reserva.'

