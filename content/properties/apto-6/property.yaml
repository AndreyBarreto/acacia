name:
  pt: 'Apto 6'
  en: 'Apt 6'
  es: 'Depto 6'

subtitle:
  pt: 'Térreo, sem escada'
  en: 'Ground floor, step-free'
  es: 'Planta baja, sin escalones'

summary: # ≤ 160
  pt: 'No térreo, sem escada da rua até dentro, a 50 m da praia. Cama de casal no quarto e sofá-cama na sala: até 3 pessoas.'
  en: 'On the ground floor and step-free from the street to the door, 50 m from the beach. A double bed and a sofa bed: sleeps 3.'
  es: 'En planta baja, sin escalones desde la calle hasta adentro, a 50 m de la playa. Cama matrimonial y sofá cama: hasta 3 personas.'

description:
  pt: |
    O Apto 6 fica no térreo. Do portão até a porta não tem degrau, o que ajuda quem chega com mala pesada, carrinho de bebê ou prefere evitar escada. A praia de Jurerê está a 50 m, no fim da rua de lajotas.

    São cerca de 33 m², em branco e cinza. O quarto tem cama de casal e uma janela que dá para o morro; na sala, o sofá abre em cama para a terceira pessoa. A cozinha fica na mesma peça, com cooktop de quatro bocas, forno elétrico, micro-ondas, frigobar e cafeteira, e uma mesa de granito com quatro cadeiras.

    Tem Wi-Fi, mesa de trabalho, ar split quente e frio e TV com streaming. Se a ideia é ficar mais tempo e trabalhar daqui, funciona; o mínimo é de 4 noites, o ano todo.

    A garagem fica no prédio, sem custo. Mandamos as instruções do self check-in pelo WhatsApp.
  en: |
    Apt 6 is on the ground floor, with no steps between the front gate and the door. That helps if you're bringing heavy bags or a stroller, or would simply rather skip stairs. Jurerê beach is 50 m away, at the end of the paved lane.

    It's about 33 m² (355 sq ft), finished in white and grey. The bedroom has a double bed and a window facing the green hills; in the living room, the sofa opens into a bed for a third guest. The kitchen shares the same space, with a four-burner stovetop, electric oven, microwave, mini fridge and coffee maker, plus a granite table with four chairs.

    There's Wi-Fi, a work desk, split air conditioning that heats and cools, and a TV with streaming. It suits a longer stay with your laptop; the minimum is 4 nights, all year round.

    Parking is in the building and free. We send self check-in instructions on WhatsApp.
  es: |
    El depto 6 está en planta baja: del portón a la puerta no hay ni un escalón. Se agradece si venís con valijas pesadas o cochecito, o si preferís no subir escaleras. La playa de Jurerê está a 50 m, al final del pasaje de adoquines.

    Tiene unos 33 m², en blanco y gris. El dormitorio tiene cama matrimonial y una ventana que mira al morro; en el living, el sofá se abre en cama para la tercera persona. La cocina está en el mismo ambiente, con anafe de cuatro hornallas, horno eléctrico, microondas, frigobar y cafetera, y una mesa de granito con cuatro sillas.

    Hay Wi-Fi, mesa para trabajar, aire split frío/calor y tele con streaming. Si pensás quedarte un tiempo largo y trabajar desde acá, funciona; el mínimo es de 4 noches, todo el año.

    La cochera está en el edificio, sin cargo. Las instrucciones del self check-in te las mandamos por WhatsApp.
  # Não dizer "acessível para cadeira de rodas" (não confirmado): só "sem escada / step-free / sin escalones".

highlights: # 3 a 6 itens, ≤ 80 cada
  pt:
    - 'Térreo, sem escada da rua até dentro'
