description:
  pt: |
    O Apto 4 fica no andar de cima, a 50 m da praia de Jurerê. A sala e o quarto têm porta para a varanda, que é comprida, tem mesa e cadeiras e dá vista para o mar, os barcos ancorados e o morro.

    São cerca de 44 m². No quarto, cama de casal, guarda-roupa e ventilador; na sala, um sofá que vira cama para a terceira pessoa. A cozinha é em corredor, com cooktop, forno elétrico, micro-ondas, geladeira e cafeteira, e uma mesa de granito para as refeições. O ar split fica no quarto e esquenta e esfria, então serve também no inverno. Tem TV com streaming.

    Tem Wi-Fi e mesa de trabalho: dá para passar algumas semanas trabalhando daqui. A estadia mínima é de 4 noites, o ano todo.

    O acesso é por escada, sem elevador. A garagem fica no prédio, sem custo, e a areia está no fim da rua de lajotas. Mandamos as instruções do self check-in pelo WhatsApp.
  en: |
    Apt 4 is the upstairs unit, 50 m from the beach in Jurerê. Both the living room and the bedroom open onto a long balcony with a table and chairs, looking out over the sea, the moored boats and the hills.

    It's about 44 m² (470 sq ft). The bedroom has a double bed, a wardrobe and a fan; the living-room sofa folds out into a bed for a third guest. The galley kitchen has a stovetop, electric oven, microwave, fridge and coffee maker, plus a granite table to eat at. The split AC is in the bedroom and heats as well as cools, so winter stays are comfortable too. There's a TV with streaming.

    You'll find Wi-Fi and a work desk, which makes a few weeks of remote work realistic. The minimum stay is 4 nights, all year round.

    Access is by stairs; there is no elevator. Parking is in the building and free, and the sand is at the end of the paved lane. We send self check-in instructions on WhatsApp.
  es: |
    El depto 4 está en la planta alta, a 50 m de la playa de Jurerê. Tanto el living como el dormitorio dan a un balcón largo, con mesa y sillas, que mira al mar, a los barcos fondeados y al morro.

    Tiene unos 44 m². En el dormitorio hay cama matrimonial, placard y ventilador; en el living, un sofá que se abre en cama para la tercera persona. La cocina es tipo pasillo, con anafe, horno eléctrico, microondas, heladera y cafetera, y una mesa de granito para comer. El aire split está en el dormitorio y es frío/calor, así que también sirve en invierno. Hay tele con streaming.

    Tenés Wi-Fi y mesa para trabajar: si venís unas semanas y te tenés que conectar, se puede. La estadía mínima es de 4 noches, todo el año.

    Se sube por escalera, no hay ascensor. La cochera está en el edificio y no se paga aparte, y la arena queda al final del pasaje de adoquines. Las instrucciones del self check-in te las mandamos por WhatsApp.

