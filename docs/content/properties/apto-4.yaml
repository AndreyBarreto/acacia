summary:                             # ≤ 160; card na home/bairro e og:description
  pt: "No andar de cima, com varanda e vista para o mar, a 50 m da praia. Cama de casal no quarto e sofá-cama na sala: até 3 pessoas."
  en: "Upstairs, with a sea-view balcony, 50 m from the beach. A double bed in the bedroom and a sofa bed in the living room: sleeps 3."
